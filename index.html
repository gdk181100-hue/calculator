<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Interest Calculator — KG BANKERS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 10px 10px 30px 10px;
      box-sizing: border-box;
    }

    .calc-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }

    /* Mobile Compact Title with inline back button */
    .mobile-header {
      background: #0e7490;
      color: #ffffff;
      padding: 16px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 22px;
      font-weight: 800;
      padding: 4px 8px;
      margin-left: -6px;
      line-height: 1;
    }

    .mobile-header-text h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .mobile-header-text span {
      font-size: 11px;
      color: #facc15;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .calc-body {
      padding: 16px;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
    }

    .form-control {
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px; /* Prevent iOS zoom-on-focus by keeping it at 15px+ */
      outline: none;
      box-sizing: border-box;
      background: #f8fafc;
      -webkit-appearance: none;
    }

    .form-control:focus {
      border-color: #0891b2;
      background: #ffffff;
    }

    /* Stacked small date container */
    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Easily touchable rating chips */
    .calc-chips-wrap {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 2px;
    }

    .rate-chip {
      padding: 10px 0;
      text-align: center;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      transition: all 0.15s ease;
    }

    .rate-chip.active {
      background: #0891b2;
      color: #ffffff;
      border-color: #0891b2;
    }

    .custom-rate-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .custom-rate-group label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
    }

    /* Stacked touch radio selectors */
    .calc-radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 8px;
    }

    .calc-radio-opt {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      cursor: pointer;
      color: #1e293b;
      padding: 4px 0;
    }

    .calc-radio-opt input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #0891b2;
    }

    /* Result Panel */
    .calc-result-box {
      margin-top: 18px;
      background: #f0fdfa;
      border: 2px solid #0891b2;
      border-radius: 8px;
      padding: 14px;
    }

    .calc-res-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13.5px;
    }

    .calc-res-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .calc-res-row.highlight {
      border-top: 1px dashed #0891b2;
      margin-top: 6px;
      padding-top: 8px;
    }

    .calc-res-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 17px;
      font-weight: 800;
      color: #0c4a6e;
      border-top: 1.5px solid #0891b2;
      margin-top: 6px;
      padding-top: 8px;
    }

    /* Compact Mobile CTA footer */
    .calc-foot {
      padding: 14px;
      background: #f8fafc;
      border-top: 1px solid #cbd5e1;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
    }

    .btn {
      padding: 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      text-align: center;
      display: inline-block;
      box-sizing: border-box;
      -webkit-appearance: none;
    }

    .btn-cyan { background: #0891b2; color: #ffffff; }
    .btn-cyan:active { background: #0e7490; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:active { background: #cbd5e1; }

    /* Custom Mobile navigation bottom bar */
    .nav-links {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      margin-top: 16px;
      padding: 0 4px;
      box-sizing: border-box;
    }

    .nav-link {
      color: #475569;
      text-decoration: underline;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="calc-container">
    <!-- Inline header replace original layout and text image_2.png -->
    <div class="mobile-header">
      <a href="index.html" class="back-btn" aria-label="Go back">←</a>
      <div class="mobile-header-text">
        <span>KG Bankers</span>
        <h2>Interest Calculator</h2>
      </div>
    </div>

    <div class="calc-body">
      <div class="form-grid">
        <!-- Customer Principal -->
        <div class="form-group">
          <label>Customer Loan Amount (₹) *</label>
          <input type="number" step="0.01" id="c_amount" class="form-control" placeholder="e.g. 20000" inputmode="decimal" required>
        </div>

        <!-- Dates row stack -->
        <div class="date-row">
          <div class="form-group">
            <label>Loan Date</label>
            <input type="date" id="c_startDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Settlement Date</label>
            <input type="date" id="c_endDate" class="form-control" required>
          </div>
        </div>

        <!-- Monthly Interest Rate -->
        <div class="form-group">
          <label>Interest Rate (% per month) *</label>
          <div class="calc-chips-wrap">
            <button type="button" class="rate-chip" data-val="1.5">1.5</button>
            <button type="button" class="rate-chip" data-val="1.75">1.75</button>
            <button type="button" class="rate-chip active" data-val="2.0">2.0</button>
            <button type="button" class="rate-chip" data-val="2.5">2.5</button>
            <button type="button" class="rate-chip" data-val="3.0">3.0</button>
          </div>
          <div class="custom-rate-group" style="margin-top: 6px;">
            <label for="c_customRate">Custom Rate %</label>
            <input type="number" step="0.01" id="c_customRate" class="form-control" value="2.0" style="padding:6px 10px; font-size:13.5px; width:70px;" inputmode="decimal">
          </div>
        </div>

        <!-- Lending Method -->
        <div class="form-group">
          <label>Calculation Method *</label>
          <div class="calc-radio-group">
            <label class="calc-radio-opt">
              <input type="radio" name="c_method" value="KG" checked>
              <span><strong>KG</strong> (Standard Rounded)</span>
            </label>
            <label class="calc-radio-opt">
              <input type="radio" name="c_method" value="BJ">
              <span><strong>BJ</strong> (Half-month & 15-day Tiers)</span>
            </label>
            <label class="calc-radio-opt">
              <input type="radio" name="c_method" value="SRB">
              <span><strong>SRB</strong> (Minus 1 Month Discount)</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Result Panel -->
      <div class="calc-result-box" id="c_resBox" style="display:none;">
        <div class="calc-res-grid">
          <div class="calc-res-row">
            <span style="color:#64748b;">Actual Duration:</span>
            <strong id="c_resDuration">-</strong>
          </div>
          <div class="calc-res-row">
            <span style="color:#64748b;">Charged Duration:</span>
            <strong id="c_resDisplayRule">-</strong>
          </div>
          <div class="calc-res-row">
            <span style="color:#64748b;">Principal Amount:</span>
            <strong id="c_resPrincipal">₹0.00</strong>
          </div>
          <div class="calc-res-row highlight">
            <span style="color:#b91c1c; font-weight:700;">Interest Amount:</span>
            <strong style="color:#b91c1c; font-weight:800; font-size:15px;">₹<span id="c_resInterest">0.00</span></strong>
          </div>
          <div class="calc-res-total">
            <span>Total Settlement:</span>
            <span id="c_resTotal">₹0.00</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Button Stack -->
    <div class="calc-foot">
      <button type="button" class="btn btn-secondary" id="btnResetCalc">Reset</button>
      <button type="button" class="btn btn-cyan" id="btnRunCalc">Calculate</button>
    </div>
  </div>

  <!-- Mobile Footer Helper navigation -->
  <div class="nav-links">
    <a href="index.html" class="nav-link">🏠 Main Ledger</a>
    <a href="monthly_interest.html" class="nav-link">📑 Monthly Audit</a>
  </div>

  <script>
    (function () {
      function getLocalDateISO() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function getRoundedMonths(months, days) {
        if (months === 0 && days > 0) return 1;
        if (days >= 4) return months + 1;
        return months;
      }

      function executeInterestCalculation() {
        const amt = parseFloat(document.getElementById('c_amount').value);
        const sDateStr = document.getElementById('c_startDate').value;
        const eDateStr = document.getElementById('c_endDate').value;
        const rate = parseFloat(document.getElementById('c_customRate').value);
        const methodEl = document.querySelector('input[name="c_method"]:checked');

        if (isNaN(amt) || amt <= 0 || !sDateStr || !eDateStr || isNaN(rate)) {
          alert("Please fill in the principal amount, dates, and interest rate.");
          return;
        }

        const sParts = sDateStr.split('-');
        const eParts = eDateStr.split('-');
        const sDate = new Date(sParts[0], sParts[1] - 1, sParts[2]);
        const eDate = new Date(eParts[0], eParts[1] - 1, eParts[2]);

        if (eDate < sDate) {
          alert("Settlement date must be on or after the loan date.");
          return;
        }

        const method = methodEl.value;
        let months = (eDate.getFullYear() - sDate.getFullYear()) * 12 + (eDate.getMonth() - sDate.getMonth());
        let days = eDate.getDate() - sDate.getDate();
        if (days < 0) {
          const lastMonth = new Date(eDate.getFullYear(), eDate.getMonth(), 0);
          days += lastMonth.getDate();
          months--;
        }

        let roundedMonths = getRoundedMonths(months, days);
        let interest = 0;
        let displayMonths = 0;

        if (method === "KG") {
          interest = amt * (rate / 100) * roundedMonths;
          displayMonths = roundedMonths;
        } else if (method === "BJ") {
          let interestMonths = 0;
          if (months === 0 && days >= 1 && days <= 15) interestMonths = 0.5;
          else if (months === 0 && days > 15) interestMonths = 1;
          else if (days > 15) interestMonths = months + 1;
          else if (days >= 4) interestMonths = months + 0.5;
          else interestMonths = months;
          interest = amt * (rate / 100) * interestMonths;
          displayMonths = interestMonths;
        } else if (method === "SRB") {
          interest = roundedMonths > 1 ? amt * (rate / 100) * (roundedMonths - 1) : 0;
          displayMonths = Math.max(roundedMonths - 1, 0);
        }

        const total = amt + interest;
        document.getElementById('c_resDuration').textContent = `${months} mo, ${days} d`;
        document.getElementById('c_resDisplayRule').textContent = `${displayMonths} mo (${method})`;
        document.getElementById('c_resPrincipal').textContent = '₹' + amt.toLocaleString('en-IN', { minimumFractionDigits: 2 });
        document.getElementById('c_resInterest').textContent = interest.toLocaleString('en-IN', { minimumFractionDigits: 2 });
        document.getElementById('c_resTotal').textContent = '₹' + total.toLocaleString('en-IN', { minimumFractionDigits: 2 });
        
        const resBox = document.getElementById('c_resBox');
        resBox.style.display = 'block';
        resBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function setCalcRate(val) {
        document.getElementById('c_customRate').value = val;
        document.querySelectorAll('.rate-chip').forEach(chip => {
          chip.classList.toggle('active', parseFloat(chip.dataset.val) === parseFloat(val));
        });
      }

      // Events
      document.getElementById('btnRunCalc').addEventListener('click', executeInterestCalculation);

      document.querySelectorAll('.rate-chip').forEach(chip => {
        chip.addEventListener('click', () => setCalcRate(chip.dataset.val));
      });

      document.getElementById('c_customRate').addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        document.querySelectorAll('.rate-chip').forEach(chip => {
          chip.classList.toggle('active', parseFloat(chip.dataset.val) === val);
        });
      });

      document.getElementById('btnResetCalc').addEventListener('click', () => {
        document.getElementById('c_amount').value = '';
        document.getElementById('c_startDate').value = getLocalDateISO();
        document.getElementById('c_endDate').value = getLocalDateISO();
        setCalcRate("2.0");
        document.getElementById('c_resBox').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // Default to current date
      document.getElementById('c_startDate').value = getLocalDateISO();
      document.getElementById('c_endDate').value = getLocalDateISO();
    })();
  </script>
</body>
</html>
